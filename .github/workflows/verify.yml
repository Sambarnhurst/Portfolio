name: Verify portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify isolated cloud mesh Worker bundle
        run: npx wrangler deploy --dry-run --config cloud-mesh/wrangler.jsonc --outdir dist-cloud-mesh
